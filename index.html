<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Theo dõi bài viết mới từ Kongehuset.dk">
  <title>Kongehuset News Monitor</title>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--blue:#155eef;--green:#067647;--red:#b42318}*{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1180px,calc(100% - 32px));margin:40px auto}h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.15rem)}p{margin:0;color:var(--muted)}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
    .notice{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:24px 0 16px;padding:16px 18px;border:1px solid #abd5c3;border-radius:10px;background:#ecfdf3}.notice strong{color:var(--green);font-size:1rem}.notice.error{border-color:#fda29b;background:#fef3f2}.notice.error strong{color:var(--red)}.error-detail{display:none;margin-top:7px;color:var(--red);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.notice.error .error-detail{display:block}
    button,select,input{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font:inherit}button{padding:0 14px;cursor:pointer;font-weight:650}.filters{display:grid;grid-template-columns:minmax(220px,1fr) 190px 170px;gap:10px;margin-bottom:16px}input,select{width:100%;padding:0 12px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}table{width:100%;min-width:820px;border-collapse:collapse}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f9fafb;color:#475467;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}tbody tr:last-child td{border-bottom:0}tbody tr.is-new{background:#fffaeb}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef4ff;color:#3538cd;white-space:nowrap;font-size:.78rem;font-weight:700}.badge.new{background:#fef3f2;color:var(--red)}.title{font-weight:650;min-width:280px}.empty,.loading{padding:40px;text-align:center;color:var(--muted)}.footer{margin-top:14px;display:flex;justify-content:space-between;gap:16px;font-size:.85rem}
    @media(max-width:720px){main{margin:24px auto}.notice{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.footer{flex-direction:column}}
  </style>
</head>
<body><main>
  <header><h1>Kongehuset News Monitor</h1><p>Theo dõi nội dung mới từ <a href="https://www.kongehuset.dk/nyhedsarkiv/" target="_blank" rel="noopener">kongehuset.dk</a>. Dữ liệu được quét mỗi 15 phút.</p></header>
  <section class="notice" id="notice" aria-live="polite"><div><strong id="notice-title">Đang tải dữ liệu…</strong><p id="notice-detail"></p><div class="error-detail" id="error-detail"></div></div><button id="mark-read" type="button">Đánh dấu tất cả đã đọc</button></section>
  <section class="filters" aria-label="Bộ lọc"><input id="search" type="search" placeholder="Tìm theo tiêu đề…" aria-label="Tìm theo tiêu đề"><select id="type" aria-label="Lọc theo loại"><option value="">Tất cả phân loại</option></select><select id="status" aria-label="Lọc theo trạng thái"><option value="">Tất cả trạng thái</option><option value="new">Chỉ bài mới</option><option value="read">Chỉ bài đã đọc</option></select></section>
  <div class="table-wrap"><table><thead><tr><th>Trạng thái</th><th>Ngày đăng</th><th>Phân loại</th><th>Tiêu đề</th><th>Liên kết</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="loading">Đang tải…</td></tr></tbody></table></div>
  <div class="footer"><span id="result-count"></span><span id="updated-at"></span></div>
</main>
<script>
  const DATA_URL='./data/news.json',STORAGE_KEY='kongehuset-last-seen-at';
  const state={data:null,lastSeen:localStorage.getItem(STORAGE_KEY)};
  const $=s=>document.querySelector(s);
  const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const isNew=item=>new Date(item.firstSeenAt)>new Date(state.lastSeen||state.data.monitoringStartedAt);
  function render(){
    const query=$('#search').value.trim().toLocaleLowerCase('vi'),type=$('#type').value,status=$('#status').value,all=state.data.articles,newCount=all.filter(isNew).length;
    const filtered=all.filter(item=>item.title.toLocaleLowerCase('vi').includes(query)&&(!type||item.type===type)&&(!status||(status==='new'?isNew(item):!isNew(item))));
    const sourceError=state.data.status?.state==='error';
    $('#notice').classList.toggle('error',sourceError);
    $('#notice-title').textContent=sourceError?'Lần quét nguồn gần nhất bị lỗi':(newCount?`Có ${newCount} bài viết mới`:'Chưa có bài viết mới');
    $('#notice-detail').textContent=sourceError?`Đang hiển thị ${all.length} bài đã lưu trước đó.`:`Nguồn hiện có ${all.length} bài trong lần quét gần nhất.`;
    $('#error-detail').textContent=sourceError?`${state.data.status.message}\nThời điểm: ${new Date(state.data.status.changedAt).toLocaleString('vi-VN')}`:'';
    $('#result-count').textContent=`Hiển thị ${filtered.length} / ${all.length} bài`;
    $('#updated-at').textContent=`Dữ liệu cập nhật: ${new Date(state.data.updatedAt).toLocaleString('vi-VN')}`;
    $('#rows').innerHTML=filtered.length?filtered.map(item=>`<tr class="${isNew(item)?'is-new':''}"><td><span class="badge ${isNew(item)?'new':''}">${isNew(item)?'Mới':'Đã đọc'}</span></td><td>${escapeHtml(item.date)}</td><td><span class="badge">${escapeHtml(item.type)}</span></td><td class="title">${escapeHtml(item.title)}</td><td><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">Xem bài ↗</a></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Không tìm thấy bài viết phù hợp.</td></tr>';
  }
  async function load(){try{const response=await fetch(`${DATA_URL}?v=${Date.now()}`);if(!response.ok)throw new Error(`Không tải được ${DATA_URL} — HTTP ${response.status} ${response.statusText}`);state.data=await response.json();if(!Array.isArray(state.data.articles))throw new Error('File dữ liệu không hợp lệ: thiếu mảng articles');[...new Set(state.data.articles.map(item=>item.type))].sort().forEach(type=>$('#type').insertAdjacentHTML('beforeend',`<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`));render()}catch(error){$('#notice').classList.add('error');$('#notice-title').textContent='Không thể tải dữ liệu';$('#notice-detail').textContent='Chi tiết lỗi:';$('#error-detail').textContent=error?.stack||error?.message||String(error);$('#rows').innerHTML='<tr><td colspan="5" class="empty">Không có dữ liệu để hiển thị.</td></tr>'}}
  $('#search').addEventListener('input',render);$('#type').addEventListener('change',render);$('#status').addEventListener('change',render);
  $('#mark-read').addEventListener('click',()=>{state.lastSeen=new Date().toISOString();localStorage.setItem(STORAGE_KEY,state.lastSeen);render()});load();
</script></body></html>
